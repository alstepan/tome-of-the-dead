# FINAL-2: build the tape on GitHub + the emulator-free checks; a pushed v* tag also publishes a GitHub Release.
# The ZEsarUX/ZRCP suites stay local (tests/*.py that drive the emulator; see docs/plan.md FINAL-2).
name: build

on:
  push:
    branches: [main]
    tags: ['v*']          # release: git tag v1.0 && git push origin v1.0
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  SJASMPLUS_TAG: v1.20.3          # == local toolchain (CLAUDE.md: sjasmplus 1.20.x)

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Python deps
        run: pip install -r .github/requirements-ci.txt

      # --- toolchain (cached: sjasmplus by tag, zx0 by the pin inside setup_zx0.sh) ---
      - name: Cache sjasmplus
        id: cache-sjasm
        uses: actions/cache@v6
        with:
          path: ~/.local/sjasmplus
          key: sjasmplus-${{ runner.os }}-${{ env.SJASMPLUS_TAG }}

      - name: Build sjasmplus
        if: steps.cache-sjasm.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$SJASMPLUS_TAG" --recursive \
              https://github.com/z00m128/sjasmplus /tmp/sjasmplus
          make -C /tmp/sjasmplus -j"$(nproc)"
          mkdir -p ~/.local/sjasmplus
          cp /tmp/sjasmplus/sjasmplus ~/.local/sjasmplus/

      - name: Put sjasmplus on PATH
        run: |
          echo "$HOME/.local/sjasmplus" >> "$GITHUB_PATH"
          "$HOME/.local/sjasmplus/sjasmplus" --version | head -1

      - name: Cache zx0
        uses: actions/cache@v6
        with:
          path: tools/bin
          key: zx0-${{ runner.os }}-${{ hashFiles('tools/setup_zx0.sh') }}

      - name: Build zx0 / dzx0
        run: tools/setup_zx0.sh

      # --- builds: build.sh fails on any assembler error OR warning, and runs rename_gate ---
      - name: Build release (DEBUG_KIT=0)
        run: tools/build.sh -DDEBUG_KIT=0

      - name: Build kit (DEBUG_KIT=1)
        run: tools/build.sh -o out/kit

      - name: Build F3_GEN=0
        run: tools/build.sh -o out/nogen -DF3_GEN=0

      # --- emulator-free checks, on the release image in build/ ---
      - name: Checks
        run: |
          set -e
          for t in tape_layout combat_tables zx0_roundtrip frames_phase frames_d3 walk_feet \
                   abl_seq itemtab textpack_test items_model_test book_model \
                   abc_tools_test test_tsx_render pt_plan pt_bot levelgen_test; do
            echo "::group::$t"
            python3 "tests/$t.py"
            echo "::endgroup::"
          done
        # tests/balance_sim_selftest.py is NOT gated: test_monotone fails on main
        # (Mage win rate falls with +30 HP); open item in docs/plan.md.

      - name: Upload tape / snapshot / symbols
        uses: actions/upload-artifact@v7
        with:
          name: tome-of-the-dead-${{ github.sha }}
          path: |
            build/tome-of-the-dead.tap
            build/tome-of-the-dead.sna
            build/tome-of-the-dead.sym
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write             # only this job can write (create the release)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tome-of-the-dead-${{ github.sha }}
          path: dist

      # Licence + third-party notices ship with the binaries (ZX0's BSD-3 needs its notice
      # in the materials distributed with the game).
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            LICENSE
            LICENSE-ASSETS.md
            THIRD-PARTY.md
          sparse-checkout-cone-mode: false
          path: src

      - name: Add licence files
        run: cp src/LICENSE src/LICENSE-ASSETS.md src/THIRD-PARTY.md dist/

      - name: Rename assets with the version + checksums
        working-directory: dist
        run: |
          v="${GITHUB_REF_NAME}"
          for ext in tap sna; do mv "tome-of-the-dead.$ext" "tome-of-the-dead-$v.$ext"; done
          rm -f tome-of-the-dead.sym      # debug symbols stay in the CI artifact only
          sha256sum tome-of-the-dead-"$v".* > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          v="${GITHUB_REF_NAME}"
          pre=""; case "$v" in *-*) pre="--prerelease";; esac   # v1.0-rc1 -> pre-release
          gh release create "$v" dist/* --title "Tome of the Dead $v" --generate-notes --verify-tag $pre
