# CI-EMU: headless ZEsarUX/ZRCP suites. Nightly + manual only (NOT on push/PR: world.py alone is ~5 min).
# Catches emulator-level regressions that the emulator-free build.yml cannot (e.g. world.py W21 after #78).
# Logic lives in tests/*.py; this file only builds the tape, installs ZEsarUX and runs one suite per matrix job.
name: emu

on:
  schedule:
    - cron: "17 3 * * *"      # nightly 03:17 UTC (default branch)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emu-${{ github.ref }}
  cancel-in-progress: true

env:
  SJASMPLUS_TAG: v1.20.3              # == build.yml
  ZESARUX_TAG: ZEsarUX-12.1           # == local toolchain (ZEsarUX 12.1 Night Shift)

jobs:
  suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false                # one red suite must not hide the others
      matrix:
        suite: [world, lock8, game, tut0]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Python deps
        run: pip install -r .github/requirements-ci.txt

      # --- assembler toolchain (same keys as build.yml, so the caches are shared) ---
      - name: Cache sjasmplus
        id: cache-sjasm
        uses: actions/cache@v6
        with:
          path: ~/.local/sjasmplus
          key: sjasmplus-${{ runner.os }}-${{ env.SJASMPLUS_TAG }}

      - name: Build sjasmplus
        if: steps.cache-sjasm.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$SJASMPLUS_TAG" --recursive \
              https://github.com/z00m128/sjasmplus /tmp/sjasmplus
          make -C /tmp/sjasmplus -j"$(nproc)"
          mkdir -p ~/.local/sjasmplus
          cp /tmp/sjasmplus/sjasmplus ~/.local/sjasmplus/

      - name: Put sjasmplus on PATH
        run: echo "$HOME/.local/sjasmplus" >> "$GITHUB_PATH"

      - name: Cache zx0
        uses: actions/cache@v6
        with:
          path: tools/bin
          key: zx0-${{ runner.os }}-${{ hashFiles('tools/setup_zx0.sh') }}

      - name: Build zx0 / dzx0
        run: tools/setup_zx0.sh

      # --- ZEsarUX: built from the pinned release tag. The explicit --disable-* flags leave only the
      # null/stdout video drivers and no audio backend, so it needs no display, sound card or -dev
      # packages (the harness also passes --vo null --ao null). ROMs are installed by ./install.sh
      # under the prefix (share/zesarux), where the binary finds them.
      - name: Cache ZEsarUX
        id: cache-zesarux
        uses: actions/cache@v6
        with:
          path: ~/.local/zesarux
          key: zesarux-${{ runner.os }}-${{ env.ZESARUX_TAG }}-v2-O2

      - name: Build ZEsarUX
        if: steps.cache-zesarux.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$ZESARUX_TAG" https://github.com/chernandezba/zesarux /tmp/zesarux
          cd /tmp/zesarux/src
          # configure adds no -O flag of its own: without this the emulator is built -O0 (5-8x slower)
          CFLAGS="-O2" ./configure --prefix "$HOME/.local/zesarux" \
              --disable-curses --disable-cursesw --disable-aa --disable-caca \
              --disable-xwindows --disable-xext --disable-xvidmode --disable-sdl --disable-fbdev \
              --disable-dsp --disable-alsa --disable-pulse --disable-sndfile --disable-pcspeaker \
              --disable-linuxrealjoystick
          make -j"$(nproc)"
          ./generate_install_sh.sh
          ./install.sh

      - name: Check ZEsarUX starts
        run: |
          echo "ZESARUX_BIN=$HOME/.local/zesarux/bin/zesarux" >> "$GITHUB_ENV"
          "$HOME/.local/zesarux/bin/zesarux" --version | head -1

      - name: Build release tape (DEBUG_KIT=0)
        run: tools/build.sh -DDEBUG_KIT=0

      - name: ZRCP round-trip probe
        run: |
          python3 - <<'PY'
          import sys, time
          sys.path.insert(0, "tools")
          from test_harness import Harness
          with Harness() as h:
              h.launch(("--emulatorspeed", "1000", "--vo", "null", "--ao", "null"))
              t = time.monotonic()
              for _ in range(200):
                  h.z.cmd("get-version")
              print(f"ZRCP round trip: {(time.monotonic() - t) / 200 * 1000:.2f} ms")
          PY

      - name: Run suite ${{ matrix.suite }}
        env:
          WZ_LAUNCH_TIMEOUT: "30"      # cold shared runners start slower than the 10 s default
          WZ_SUITE_TIMEOUT: "2100"     # 35 min wall cap: a hang kills the emulator and fails, never stalls
        run: |
          mkdir -p logs
          start=$SECONDS
          set +e
          python3 -u "tests/${{ matrix.suite }}.py" 2>&1 | tee "logs/${{ matrix.suite }}.log"
          rc=${PIPESTATUS[0]}
          echo "suite ${{ matrix.suite }}: rc=$rc, $((SECONDS - start)) s" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Upload suite log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: emu-log-${{ matrix.suite }}
          path: logs/
          if-no-files-found: ignore
